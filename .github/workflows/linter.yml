name: Linter

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ESLint

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install

      - name: Execute linter
        run: pnpm lint
